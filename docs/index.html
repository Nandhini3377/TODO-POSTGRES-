<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .todos-list {
            margin-top: 30px;
        }

        .todo-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
        }

        .todo-content {
            flex: 1;
        }

        .todo-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .todo-description {
            font-size: 14px;
            color: #666;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .todo-actions button {
            padding: 5px 10px;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .complete-btn {
            background: #28a745;
        }

        .complete-btn:hover {
            background: #218838;
        }

        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .success {
            color: #155724;
            padding: 10px;
            background: #d4edda;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My Todo App</h1>

        <div id="message"></div>

        <div class="input-group">
            <input
                type="text"
                id="titleInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >
            <textarea
                id="descriptionInput"
                placeholder="Add a description (optional)"
            ></textarea>
            <button onclick="addTodo()">Add Todo</button>
        </div>

        <div class="todos-list" id="todosList">
            <p style="text-align: center; color: #999;">Loading todos...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://todo-postgres-bndk.onrender.com";

        function showMessage(message, type) {
            const messageDiv = document.getElementById("message");
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = "";
            }, 3000);
        }

        async function loadTodos() {
            try {
                const response = await fetch(`${API_URL}/todos`);
                const todos = await response.json();
                displayTodos(todos);
            } catch (error) {
                showMessage("Error loading todos", "error");
            }
        }

        function displayTodos(todos) {
            const todosList = document.getElementById("todosList");

            if (todos.length === 0) {
                todosList.innerHTML = "<p style='text-align: center; color: #999;'>No todos yet. Add one above!</p>";
                return;
            }

            todosList.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}">
                    <div class="todo-content">
                        <div class="todo-title">${escapeHtml(todo.title)}</div>
                        ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                        <small style="color: #999;">${new Date(todo.created_at).toLocaleDateString()}</small>
                    </div>
                    <div class="todo-actions">
                        <button class="complete-btn" onclick="toggleComplete(${todo.id}, ${todo.completed})">
                            ${todo.completed ? "✓ Done" : "Mark Done"}
                        </button>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function addTodo() {
            const title = document.getElementById("titleInput").value;
            const description = document.getElementById("descriptionInput").value;

            if (!title.trim()) {
                showMessage("Please enter a title", "error");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/todos`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description || null
                    })
                });

                if (response.ok) {
                    document.getElementById("titleInput").value = "";
                    document.getElementById("descriptionInput").value = "";
                    showMessage("Todo added successfully!", "success");
                    loadTodos();
                } else {
                    showMessage("Error adding todo", "error");
                }
            } catch (error) {
                showMessage("Error adding todo", "error");
            }
        }

        async function toggleComplete(id, completed) {
            try {
                const response = await fetch(`${API_URL}/todos/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        completed: !completed
                    })
                });

                if (response.ok) {
                    loadTodos();
                } else {
                    showMessage("Error updating todo", "error");
                }
            } catch (error) {
                showMessage("Error updating todo", "error");
            }
        }

        async function deleteTodo(id) {
            if (!confirm("Are you sure you want to delete this todo?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/todos/${id}`, {
                    method: "DELETE"
                });

                if (response.ok) {
                    showMessage("Todo deleted", "success");
                    loadTodos();
                } else {
                    showMessage("Error deleting todo", "error");
                }
            } catch (error) {
                showMessage("Error deleting todo", "error");
            }
        }

        loadTodos();
    </script>
</body>
</html>
